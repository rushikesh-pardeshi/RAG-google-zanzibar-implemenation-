global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: openfga
    static_configs:
      - targets: ["openfga:2112"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]


